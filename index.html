<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Clothes Shop - Fashion for Everyone</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="Shop the latest trends in men's and women's clothing. Affordable fashion with fast shipping.">
    <meta name="keywords" content="clothes, fashion, shopping, men's wear, women's wear, online store">
    <meta name="author" content="Your Name">
    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="My Clothes Shop">
    <meta property="og:description" content="Discover trendy clothes at great prices.">
    <meta property="og:image" content="/images/tshirt.jpeg">
    <meta property="og:url" content="https://yourdomain.com">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">My Clothes Shop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#products">Products</a></li>
                </ul>
                <span class="navbar-text">Cart (<span id="cart-count">0</span>)</span>
                <button class="btn btn-outline-light ms-2" id="view-cart">View Cart</button>
            </div>
        </div>
    </nav>

    <section id="home" class="container my-5">
        <div class="text-center">
            <h1>Welcome to Our Fashion Store</h1>
            <p class="lead">Shop the latest trends in clothing!</p>
        </div>
    </section>

    <section id="products" class="container my-5">
        <h2 class="text-center mb-4">Products</h2>
        <div id="product-list" class="row"></div>
    </section>

    <div id="cart-modal" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Your Cart</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul id="cart-items" class="list-group"></ul>
                    <p class="mt-3">Total: £<span id="total">0</span></p>
                </div>
                <div class="modal-footer">
                    <button id="checkout" class="btn btn-primary">Checkout with Stripe</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Stripe Payment Form (Hidden until checkout) -->
     <!-- ... existing code ... -->

<!-- Stripe Payment Form (Hidden until checkout) -->
<div id="payment-form" class="container my-5" style="display:none;">
    <h3>Payment Details</h3>
    <form id="stripe-form">
        <div class="mb-3">
            <label for="customer-email" class="form-label">Email (for receipt)</label>
            <input type="email" id="customer-email" class="form-control" required>
        </div>
        <div id="card-element" class="form-control"></div>
        <button type="submit" class="btn btn-success mt-3">Pay</button>
    </form>
</div>




    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Stripe JS -->
    <script src="https://js.stripe.com/v3/"></script>
    <script src="script.js"></script>
</body>
</html>
